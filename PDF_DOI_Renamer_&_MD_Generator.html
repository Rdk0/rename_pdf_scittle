<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
    <title>PDF DOI Renamer & MD Generator</title>

    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- React Dependencies (required by Scittle Reagent) -->
    <script src="https://cdn.jsdelivr.net/npm/react@18/umd/react.production.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/react-dom@18/umd/react-dom.production.min.js"></script>

    <!-- Scittle Core & Plugins -->
    <script src="https://cdn.jsdelivr.net/npm/scittle@0.6.15/dist/scittle.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/scittle@0.6.15/dist/scittle.reagent.js"></script>

    <!-- PDF.js for extraction -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    </script>

    <style>
      :root { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); }
    </style>
</head>

<body class="bg-gray-100 text-gray-900 p-8">

    <div id="app"></div>

    <!-- Scittle ClojureScript UI Logic -->
    <script type="application/x-scittle">
      (require '[reagent.core :as r]
               '[reagent.dom :as rdom]
               '[clojure.string :as str])

      ;; =========================================================
      ;; 1. State
      ;;    :files is a vector of maps:
      ;;    {:file <js/File> :status :doi :bib :new-name :error}
      ;; =========================================================

      (def state (r/atom {:files         []
                           :override-doi  ""
                           :processing?   false}))

      ;; =========================================================
      ;; 2. PDF text extraction (PDF.js)
      ;; =========================================================

      (defn extract-text-from-pdf
        "Reads the first page of a PDF File object and resolves with its
         plain-text content, using PDF.js under the hood."
        [file-obj]
        (js/Promise.
         (fn [resolve reject]
           (let [reader (js/FileReader.)]
             (set! (.-onload reader)
                   (fn [e]
                     (let [typed-array (js/Uint8Array. (.. e -target -result))]
                       (-> (.getDocument js/pdfjsLib typed-array)
                           .-promise
                           (.then (fn [pdf] (.getPage pdf 1)))
                           (.then (fn [page] (.getTextContent page)))
                           (.then (fn [content]
                                    (let [text (->> (js->clj (.-items content))
                                                     (map #(get % "str"))
                                                     (str/join " "))]
                                      (resolve text))))
                           (.catch reject)))))
             (.readAsArrayBuffer reader file-obj)))))

      ;; =========================================================
      ;; 3. DOI / BibTeX metadata parsing
      ;; =========================================================

      (defn extract-doi
        "Finds the first DOI-shaped substring in a block of text and
         strips any leading 'doi:' prefix or trailing punctuation."
        [text]
        (let [doi-regex #"10\.\d{4,9}/[-._;()/:A-Za-z0-9]+"]
          (when-let [raw-match (re-find doi-regex text)]
            (-> raw-match
                (str/replace #"^doi:\s*" "")
                (str/replace #"[.,;)]$" "")
                str/trim))))

      (defn- first-author-surname
        "Extracts a filename-safe surname from a BibTeX 'author' field,
         which is typically formatted as 'Last, First and Last2, First2 ...'."
        [raw-author]
        (-> (str/split raw-author #"\s+and\s+")
            first
            (str/split #"[,\s]+")
            first
            (str/replace #"[\{\}]" "")
            str/trim))

      (defn parse-bib-metadata
        "Parses a BibTeX string into a target filename of the form
         'Author_Year_Journal.pdf'. Returns nil if any field is missing."
        [bib-str]
        (let [field (fn [name]
                      (second (re-find (re-pattern (str "(?i)" name "\\s*=\\s*\\{([^}]+)\\}")) bib-str)))
              author  (field "author")
              year    (field "year")
              journal (field "journal")]
          (when (and author year journal)
            (str (first-author-surname author) "_" year "_"
                 (str/replace journal #"\s+" "_") ".pdf"))))

      ;; =========================================================
      ;; 4. Crossref lookup
      ;; =========================================================

      (defn fetch-bib-from-doi
        "Fetches the BibTeX record for a DOI from the Crossref API."
        [doi]
        (let [cleaned (str/trim doi)
              url (str "https://api.crossref.org/works/" cleaned "/transform/application/x-bibtex")]
          (-> (js/fetch url)
              (.then (fn [res]
                       (if (.-ok res)
                         (.text res)
                         (throw (js/Error. (str "Crossref HTTP Error " (.-status res))))))))))

      ;; =========================================================
      ;; 5. Markdown note generation
      ;; =========================================================

      (defn generate-md-content
        "Builds a Markdown note: the BibTeX block (one field per line)
         followed by empty Summary / Quotes / Questions sections."
        [bib-str]
        (let [formatted-bib (str/replace bib-str "," ",\n")]
          (str formatted-bib "\n\n\n# Summary\n\n\n# Quotes and Data\n\n\n# Questions")))

      ;; =========================================================
      ;; 6. Client-side file download
      ;; =========================================================

      (defn download-blob
        "Triggers a direct browser download of a Blob, without ever
         hitting a server: wraps the blob in a temporary object URL,
         'clicks' an invisible <a download> pointed at it, then frees
         the URL."
        [content-blob filename]
        (let [url (.createObjectURL js/URL content-blob)
              a   (.createElement js/document "a")]
          (set! (.-href a) url)
          (set! (.-download a) filename)
          (.click a)
          (.revokeObjectURL js/URL url)))

      ;; =========================================================
      ;; 7. Filename sanitizers
      ;; =========================================================

      (defn- current-name
        "The name a file is currently known by: its processed :new-name
         if one has been set (e.g. by DOI processing), else the name it
         was uploaded with."
        [f]
        (or (:new-name f) (.. f -file -name)))

      (defn- sanitize-all-files!
        "Applies `clean-fn` (String -> String) to every file's *current*
         name (see current-name) — so this correctly cleans up names
         generated by the DOI/BibTeX pipeline, not just the name the PDF
         was originally uploaded with. For each matching file this both
         (a) updates :new-name in `state`, tagging the row with `label`,
         AND (b) immediately triggers a browser download of that file's
         original content under the cleaned name — so the cleaned-up
         file actually lands in your Downloads folder, not just in the
         table.
         `pred` (String -> boolean) optionally restricts which files are
         touched, tested against current-name; defaults to touching
         every file.
         Note: some browsers ask for permission (or silently block)
         when a page triggers several downloads back-to-back; allow
         multiple downloads for this page if prompted."
        [label clean-fn & [pred]]
        (let [pred (or pred (constantly true))
              matches (->> (:files @state)
                           (filter #(pred (current-name %))))]
          ;; Trigger the actual downloads first.
          (doseq [f matches]
            (download-blob (:file f) (clean-fn (current-name f))))
          ;; Then update the table to reflect what was renamed.
          (swap! state update :files
                 (fn [files]
                   (mapv (fn [f]
                           (let [nm (current-name f)]
                             (if (pred nm)
                               (assoc f :new-name (clean-fn nm) :status label)
                               f)))
                         files)))))

      (defn sanitize-spaces!
        "Replaces spaces in every filename with underscores and downloads
         each file under its cleaned name."
        []
        (sanitize-all-files! "Renamed (Space Clean) - downloaded"
                              #(str/replace % " " "_")))

      (defn sanitize-ampersand!
        "Replaces ampersands in filenames with '_and_' and downloads each
         affected file under its cleaned name. Handles both the literal
         '&' character and the HTML entity '&amp;' (matched and replaced
         as a whole, so it doesn't leave a stray 'amp;' behind).
         Only touches files whose name actually contains one of these."
        []
        (sanitize-all-files! "Renamed (& Clean) - downloaded"
                              #(-> %
                                   (str/replace #"(?i)&amp;" "_and_")
                                   (str/replace #"&" "_and_"))
                              #(str/includes? % "&")))

      ;; =========================================================
      ;; 8. Processing pipeline: extract DOI -> fetch BibTeX -> rename
      ;; =========================================================

      (defn process-single-file!
        "Runs one file through the full pipeline: resolve a DOI (either
         the given `explicit-doi` or one extracted from the PDF text),
         fetch its BibTeX from Crossref, then derive a new filename.
         Updates `state` at every stage so the UI can show progress."
        [id explicit-doi]
        (swap! state assoc-in [:files id :status] "Processing...")
        (let [item     (get-in @state [:files id])
              file-obj (:file item)
              doi-promise (if explicit-doi
                            (js/Promise.resolve explicit-doi)
                            (-> (extract-text-from-pdf file-obj)
                                (.then (fn [text]
                                         (if-let [d (extract-doi text)]
                                           d
                                           (throw (js/Error. "No DOI found in PDF text")))))))]
          (-> doi-promise
              (.then (fn [doi]
                       (swap! state update-in [:files id] merge {:doi doi :status "Fetching BibTeX..."})
                       (fetch-bib-from-doi doi)))
              (.then (fn [bib-str]
                       (if-let [new-name (parse-bib-metadata bib-str)]
                         (swap! state update-in [:files id] merge {:bib bib-str
                                                                    :new-name new-name
                                                                    :status "Done"})
                         (throw (js/Error. "Incomplete BibTeX metadata (Missing Author/Year/Journal)")))))
              (.catch (fn [err]
                        (swap! state update-in [:files id] merge {:status "Failed"
                                                                   :error (.-message err)}))))))

      (defn process-all!
        "Runs process-single-file! (auto-detecting the DOI) over every file."
        []
        (doseq [id (range (count (:files @state)))]
          (process-single-file! id nil)))

      ;; =========================================================
      ;; 9. UI components
      ;; =========================================================

      (defn status-badge
        [status error]
        [:<>
         [:span {:class (cond
                          (= status "Done")                      "text-green-600 font-semibold"
                          (str/starts-with? status "Renamed")    "text-purple-600 font-semibold"
                          (= status "Failed")                    "text-red-600 font-semibold"
                          :else                                  "text-amber-600 animate-pulse")}
          status]
         (when error
           [:p {:class "text-xs text-red-500 mt-1"} error])])

      (defn download-buttons
        "Save PDF / Save MD buttons; MD button only shows once BibTeX
         has actually been fetched for this row."
        [file new-name bib]
        [:<>
         [:button {:class "px-2 py-1 text-xs bg-green-600 text-white hover:bg-green-700 rounded"
                   :on-click #(download-blob file new-name)}
          "Save PDF"]
         (when bib
           [:button {:class "px-2 py-1 text-xs bg-indigo-600 text-white hover:bg-indigo-700 rounded"
                     :on-click #(let [md-name (str/replace new-name #"\.pdf$" ".md")
                                      blob (js/Blob. #js [(generate-md-content bib)] #js {:type "text/markdown"})]
                                  (download-blob blob md-name))}
            "Save MD"])])

      (defn file-row
        [id {:keys [file status doi new-name bib error]}]
        [:tr {:class "border-b hover:bg-gray-50"}
         [:td {:class "p-3 text-sm font-medium text-gray-800"} (.-name file)]
         [:td {:class "p-3 text-sm text-gray-600"} (or doi "-")]
         [:td {:class "p-3 text-sm font-semibold text-blue-600"} (or new-name "-")]
         [:td {:class "p-3 text-sm"} [status-badge status error]]
         [:td {:class "p-3 text-sm space-x-2"}
          [:button {:class "px-2 py-1 text-xs bg-slate-200 hover:bg-slate-300 rounded"
                    :on-click #(process-single-file! id nil)}
           "Process"]
          (when (and new-name (not= status "Failed"))
            [download-buttons file new-name bib])]])

      (defn file-picker
        [file-count]
        [:div {:class "flex flex-wrap items-center gap-4 border-2 border-dashed border-gray-300 p-6 rounded-lg mb-6 bg-gray-50"}
         [:input {:type "file"
                  :multiple true
                  :accept ".pdf"
                  :class "block text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100"
                  :on-change (fn [e]
                               (let [selected-files (js/Array.from (.. e -target -files))
                                     formatted (mapv (fn [f] {:file f :status "Pending"}) selected-files)]
                                 (swap! state assoc :files formatted)))}]
         [:span {:class "text-xs text-gray-400"} (str file-count " file(s) selected")]])

      (defn batch-actions []
        [:div {:class "flex flex-wrap gap-2 mb-6"}
         [:button {:class "px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded text-sm"
                   :on-click process-all!}
          "Run All (Auto DOI)"]
         [:button {:class "px-4 py-2 bg-slate-600 hover:bg-slate-700 text-white font-medium rounded text-sm"
                   :on-click sanitize-spaces!}
          "Remove Spaces"]
         [:button {:class "px-4 py-2 bg-slate-600 hover:bg-slate-700 text-white font-medium rounded text-sm"
                   :on-click sanitize-ampersand!}
          "Remove '&' Characters"]])

      (defn manual-doi-form
        [override-doi]
        [:div {:class "flex items-center gap-2 mb-6 p-4 bg-amber-50 rounded border border-amber-200"}
         [:span {:class "text-xs font-semibold text-amber-800"} "Manual DOI Run (run1doi):"]
         [:input {:type "text"
                  :placeholder "10.xxxx/xxxx"
                  :value override-doi
                  :class "px-3 py-1 border rounded text-sm flex-1"
                  :on-change #(swap! state assoc :override-doi (.. % -target -value))}]
         [:button {:class "px-3 py-1 bg-amber-600 hover:bg-amber-700 text-white text-xs rounded font-medium"
                   :disabled (str/blank? override-doi)
                   :on-click #(process-single-file! 0 override-doi)}
          "Apply to First File"]])

      (defn results-table
        [files]
        [:div {:class "overflow-x-auto"}
         [:table {:class "w-full text-left border-collapse"}
          [:thead {:class "bg-gray-100 border-b text-xs text-gray-500 uppercase"}
           [:tr
            [:th {:class "p-3"} "Original PDF"]
            [:th {:class "p-3"} "DOI"]
            [:th {:class "p-3"} "Renamed Target"]
            [:th {:class "p-3"} "Status"]
            [:th {:class "p-3"} "Actions"]]]
          [:tbody
           (map-indexed (fn [idx item] ^{:key idx} [file-row idx item]) files)]]])

      (defn main-ui []
        (let [{:keys [files override-doi]} @state]
          [:div {:class "max-w-6xl mx-auto bg-white rounded-lg shadow-md p-6"}
           [:h1 {:class "text-2xl font-bold text-gray-800 mb-2"} "PDF & DOI Renamer (Scittle UI)"]
           [:p {:class "text-sm text-gray-500 mb-6"} "Process PDFs directly in your browser without requiring JVM or Babashka setup."]

           [file-picker (count files)]

           (when (seq files) [batch-actions])
           (when (seq files) [manual-doi-form override-doi])

           (if (seq files)
             [results-table files]
             [:div {:class "text-center py-8 text-gray-400 text-sm"} "Select one or more PDF files to begin processing."])]))

      ;; =========================================================
      ;; 10. Mount
      ;; =========================================================

      (rdom/render [main-ui] (.getElementById js/document "app"))
    </script>
</body>
</html>
