<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PDF DOI Renamer & MD Generator</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>

    <!-- React Dependencies (Required by Scittle Reagent) -->
    <script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>

    <!-- Scittle Core & Plugins -->
    <script src="https://cdn.jsdelivr.net/npm/scittle@0.6.15/dist/scittle.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/scittle@0.6.15/dist/scittle.reagent.js"></script>

    <!-- PDF.js for extraction -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.min.js"></script>
    <script>
      pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';
    </script>
</head>


<body class="bg-gray-100 text-gray-900 p-8">

    <div id="app"></div>

    <!-- Scittle ClojureScript UI Logic -->
    <script type="application/x-scittle">
      (require '[reagent.core :as r]
               '[reagent.dom :as rdom]
               '[clojure.string :as str])

      ;; -----------------------------------------------------------------------
      ;; Global State
      ;; -----------------------------------------------------------------------
      (def state (r/atom {:files []        ;; list of {:id :file :status :doi :bib :new-name :error}
                          :override-doi ""
                          :processing? false}))

      ;; -----------------------------------------------------------------------
      ;; Core Utilities & Parser Helpers
      ;; -----------------------------------------------------------------------
      
      (defn extract-text-from-pdf
        "Extracts text from the first page of a PDF File object using PDF.js"
        [file-obj]
        (js/Promise.
         (fn [resolve reject]
           (let [reader (js/FileReader.)]
             (set! (.-onload reader)
                   (fn [e]
                     (let [typed-array (js/Uint8Array. (.. e -target -result))]
                       (-> (.getDocument js/pdfjsLib typed-array)
                           .-promise
                           (.then (fn [pdf] (.getPage pdf 1)))
                           (.then (fn [page] (.getTextContent page)))
                           (.then (fn [content]
                                    (let [text (->> (js->clj (.-items content))
                                                    (map #(get % "str"))
                                                    (str/join " "))]
                                      (resolve text))))
                           (.catch reject)))))
             (.readAsArrayBuffer reader file-obj)))))




(defn extract-doi
  "Finds and cleans first matching DOI string from a raw block of text"
  [text]
  (let [doi-regex #"10\.\d{4,9}/[-._;()/:A-Za-z0-9]+"]
    (when-let [raw-match (re-find doi-regex text)]
      (-> raw-match
          (str/replace #"^doi:\s*" "")
          (str/replace #"[.,;)]$" "") ;; strip trailing punctuation
          str/trim))))

      (defn fetch-bib-from-doi
        "Fetches bibtex from Crossref API given a DOI string"
        [doi]
        (let [cleaned (str/trim doi)
              url (str "https://api.crossref.org/works/" cleaned "/transform/application/x-bibtex")]
          (-> (js/fetch url)
              (.then (fn [res]
                       (if (.-ok res)
                         (.text res)
                         (throw (js/Error. (str "Crossref HTTP Error " (.-status res))))))))))

      (defn parse-bib-metadata
        "Parses BibTeX output into target filename string: Author_Year_Journal.pdf"
        [bib-str]
        (let [author-match (re-find #"(?i)author\s*=\s*\{([^}]+)\}" bib-str)
              year-match   (re-find #"(?i)year\s*=\s*\{([^}]+)\}" bib-str)
              journal-match (re-find #"(?i)journal\s*=\s*\{([^}]+)\}" bib-str)
              
              raw-author (when author-match (second author-match))
              year (when year-match (second year-match))
              journal (when journal-match (second journal-match))
              
              first-author (when raw-author
                             (-> (str/split raw-author #"\s+and\s+")
                                 first
                                 (str/split #"[,\s]+")
                                 first
                                 (str/replace #"[\{\}]" "")
                                 str/trim))]
          (if (and first-author year journal)
            (str first-author "_" year "_" (str/replace journal #"\s+" "_") ".pdf")
            nil)))

      (defn generate-md-content
        "Creates formatted Markdown text block based on bib information"
        [bib-str]
        (let [formatted-bib (str/replace bib-str "," ",\n")]
          (str formatted-bib "\n\n\n# Summary\n\n\n# Quotes and Data\n\n\n# Questions")))

      (defn download-blob
        "Triggers direct browser download for generated file payload"
        [content-blob filename]
        (let [url (.createObjectURL js/URL content-blob)
              a (.createElement js/document "a")]
          (set! (.-href a) url)
          (set! (.-download a) filename)
          (.click a)
          (.revokeObjectURL js/URL url)))

      ;; -----------------------------------------------------------------------
      ;; Pipeline Execution Functions
      ;; -----------------------------------------------------------------------

      (defn process-single-file!
        [id explicit-doi]
        (swap! state assoc-in [:files id :status] "Processing...")
        (let [item (get-in @state [:files id])
              file-obj (:file item)]
          (-> (if explicit-doi
                (js/Promise.resolve explicit-doi)
                (-> (extract-text-from-pdf file-obj)
                    (.then (fn [text]
                             (if-let [d (extract-doi text)]
                               d
                               (throw (js/Error. "No DOI found in PDF text")))))))
              (.then (fn [doi]
                       (swap! state update-in [:files id] merge {:doi doi :status "Fetching BibTeX..."})
                       (fetch-bib-from-doi doi)))
              (.then (fn [bib-str]
                       (if-let [new-name (parse-bib-metadata bib-str)]
                         (swap! state update-in [:files id] merge {:bib bib-str
                                                                   :new-name new-name
                                                                   :status "Done"})
                         (throw (js/Error. "Incomplete BibTeX metadata (Missing Author/Year/Journal)")))))
              (.catch (fn [err]
                        (swap! state update-in [:files id] merge {:status "Failed"
                                                                  :error (.-message err)}))))))

      (defn process-all!
        []
        (doseq [[id _] (map-indexed vector (:files @state))]
          (process-single-file! id nil)))

      (defn sanitize-spaces!
        []
        (swap! state update :files
               (fn [files]
                 (mapv (fn [f]
                         (let [clean (str/replace (.. f -file -name) #" " "_")]
                           (assoc f :new-name clean :status "Renamed (Space Clean)")))
                       files))))

      (defn sanitize-ampersand!
        []
        (swap! state update :files
               (fn [files]
                 (mapv (fn [f]
                         (if (str/includes? (.. f -file -name) "&")
                           (let [clean (str/replace (.. f -file -name) #"&amp;?" "_")]
                             (assoc f :new-name clean :status "Renamed (& Clean)"))
                           f))
                       files))))

      ;; -----------------------------------------------------------------------
      ;; UI Components
      ;; -----------------------------------------------------------------------

      (defn file-row
        [id item]
        (let [{:keys [file status doi new-name bib error]} item
              orig-name (.-name file)]
          [:tr {:class "border-b hover:bg-gray-50"}
           [:td {:class "p-3 text-sm font-medium text-gray-800"} orig-name]
           [:td {:class "p-3 text-sm text-gray-600"} (or doi "-")]
           [:td {:class "p-3 text-sm font-semibold text-blue-600"} (or new-name "-")]
           [:td {:class "p-3 text-sm"}
            [:span {:class (cond
                             (= status "Done") "text-green-600 font-semibold"
                             (str/starts-with? status "Renamed") "text-purple-600 font-semibold"
                             (= status "Failed") "text-red-600 font-semibold"
                             :else "text-amber-600 animate-pulse")}
             status]
            (when error
              [:p {:class "text-xs text-red-500 mt-1"} error])]
           [:td {:class "p-3 text-sm space-x-2"}
            [:button {:class "px-2 py-1 text-xs bg-slate-200 hover:bg-slate-300 rounded"
                      :on-click #(process-single-file! id nil)}
             "Process"]
            (when (and new-name (not= status "Failed"))
              [:<>
               [:button {:class "px-2 py-1 text-xs bg-green-600 text-white hover:bg-green-700 rounded"
                         :on-click #(download-blob file new-name)}
                "Save PDF"]
               (when bib
                 [:button {:class "px-2 py-1 text-xs bg-indigo-600 text-white hover:bg-indigo-700 rounded"
                           :on-click #(let [md-name (str/replace new-name #"\.pdf$" ".md")
                                            blob (js/Blob. #js [(generate-md-content bib)] #js {:type "text/markdown"})]
                                        (download-blob blob md-name))}
                  "Save MD"])])]]))

      (defn main-ui []
        (let [s @state]
          [:div {:class "max-w-6xl mx-auto bg-white rounded-lg shadow-md p-6"}
           [:h1 {:class "text-2xl font-bold text-gray-800 mb-2"} "PDF & DOI Renamer (Scittle UI)"]
           [:p {:class "text-sm text-gray-500 mb-6"} "Process PDFs directly in your browser without requiring JVM or Babashka setup."]

           ;; File selection controls
           [:div {:class "flex flex-wrap items-center gap-4 border-2 border-dashed border-gray-300 p-6 rounded-lg mb-6 bg-gray-50"}
            [:input {:type "file"
                     :multiple true
                     :accept ".pdf"
                     :class "block text-sm text-gray-500 file:mr-4 file:py-2 file:px-4 file:rounded-md file:border-0 file:text-sm file:font-semibold file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100"
                     :on-change (fn [e]
                                  (let [selected-files (js/Array.from (.. e -target -files))
                                        formatted (mapv (fn [f] {:file f :status "Pending"}) selected-files)]
                                    (swap! state assoc :files formatted)))}]
            [:span {:class "text-xs text-gray-400"} (str (count (:files s)) " file(s) selected")]]

           ;; Batch Action Buttons
           (when (seq (:files s))
             [:div {:class "flex flex-wrap gap-2 mb-6"}
              [:button {:class "px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white font-medium rounded text-sm"
                        :on-click process-all!}
               "Run All (Auto DOI)"]
              [:button {:class "px-4 py-2 bg-slate-600 hover:bg-slate-700 text-white font-medium rounded text-sm"
                        :on-click sanitize-spaces!}
               "Remove Spaces"]
              [:button {:class "px-4 py-2 bg-slate-600 hover:bg-slate-700 text-white font-medium rounded text-sm"
                        :on-click sanitize-ampersand!}
               "Remove '&' Characters"]])

           ;; Explicit DOI Override Form
           (when (seq (:files s))
             [:div {:class "flex items-center gap-2 mb-6 p-4 bg-amber-50 rounded border border-amber-200"}
              [:span {:class "text-xs font-semibold text-amber-800"} "Manual DOI Run (run1doi):"]
              [:input {:type "text"
                       :placeholder "10.xxxx/xxxx"
                       :value (:override-doi s)
                       :class "px-3 py-1 border rounded text-sm flex-1"
                       :on-change #(swap! state assoc :override-doi (.. % -target -value))}]
              [:button {:class "px-3 py-1 bg-amber-600 hover:bg-amber-700 text-white text-xs rounded font-medium"
                        :disabled (str/blank? (:override-doi s))
                        :on-click #(process-single-file! 0 (:override-doi s))}
               "Apply to First File"]])

           ;; Data Table Output
           (if (seq (:files s))
             [:div {:class "overflow-x-auto"}
              [:table {:class "w-full text-left border-collapse"}
               [:thead {:class "bg-gray-100 border-b text-xs text-gray-500 uppercase"}
                [:tr
                 [:th {:class "p-3"} "Original PDF"]
                 [:th {:class "p-3"} "DOI"]
                 [:th {:class "p-3"} "Renamed Target"]
                 [:th {:class "p-3"} "Status"]
                 [:th {:class "p-3"} "Actions"]]]
               [:tbody
                (map-indexed (fn [idx item] ^{:key idx} [file-row idx item]) (:files s))]]]
             [:div {:class "text-center py-8 text-gray-400 text-sm"} "Select one or more PDF files to begin processing."])]))

      ;; Mount React App
      (rdom/render [main-ui] (.getElementById js/document "app"))
    </script>
</body>
</html>
